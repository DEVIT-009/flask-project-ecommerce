<!DOCTYPE html>
<html lang="en" data-theme="vscode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bookit Admin{% endblock %}</title>

    <!-- FlyonUI CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    {% block head %}{% endblock %}
</head>
<body class="bg-base-200 font-sans">

    <!-- ================= ADMIN SHELL ================= -->
    <div class="flex h-screen overflow-hidden">

        <!-- ================= SIDEBAR ================= -->
        {% include "admin/sections/sidebar.html" %}

        <!-- ================= MAIN CONTENT AREA ================= -->
        <div class="flex flex-col flex-1 overflow-hidden">

            <!-- ================= TOPBAR ================= -->
            {% include "admin/sections/topbar.html" %}

            <!-- ================= PAGE CONTENT ================= -->
            <main class="flex-1 overflow-y-auto p-6 space-y-6">
                {% block content %}{% endblock %}
            </main>

        </div>
    </div>

<!-- FlyonUI JS -->
<script src="{{ url_for('static', filename='js/flyonui.js') }}"></script>
{% block scripts %}{% endblock %}

</body>
</html>
