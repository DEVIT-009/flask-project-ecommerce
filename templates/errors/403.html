<!DOCTYPE html>
<html lang="en" data-theme="vscode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Forbidden</title>

    <!-- FlyonUI CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
</head>
<body class="bg-base-200 font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden select-none">

    <!-- Ambient background glow -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-error/15 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-primary/10 rounded-full blur-3xl"></div>
    </div>

    <!-- 403 Container -->
    <div class="relative z-10 text-center max-w-sm w-full">
        <div class="card bg-base-100/90 backdrop-blur-md shadow-2xl border border-base-content/10 rounded-3xl p-8 sm:p-10 space-y-4">
            <!-- 403 Status Number -->
            <div class="font-mono text-8xl font-black text-error leading-none" style="font-size: 6rem; line-height: 1;">
                403
            </div>

            <!-- Title -->
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-base-content">
                Access Forbidden
            </h1>

            <!-- Description -->
            <p class="text-sm text-base-content/60 font-medium">
                You do not have permission to access this resource. Admin privileges are required.
            </p>

            <!-- Action Button -->
            <div class="pt-3 flex flex-col gap-2">
                <a href="{{ url_for('admin_routes.dashboard') }}"
                   class="btn btn-primary btn-sm w-full rounded-xl shadow-lg shadow-primary/20 font-semibold gap-2">
                    <span class="material-symbols-outlined text-[16px]">dashboard</span>
                    Return to Dashboard
                </a>
            </div>
        </div>
    </div>

    <script>
        const savedTheme = localStorage.getItem("theme") || "vscode";
        document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
</body>
</html>
