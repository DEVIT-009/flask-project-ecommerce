<!DOCTYPE html>
<html lang="en" data-theme="vscode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>429 — Too many request</title>

    <!-- FlyonUI CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
</head>
<body class="bg-base-200 font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden select-none">

    <!-- Ambient background glow -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-warning/15 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-primary/10 rounded-full blur-3xl"></div>
    </div>

    <!-- Theme toggle floating in top-right -->
    <div class="absolute top-6 right-6 z-20">
        <label class="swap swap-rotate btn btn-text btn-circle size-10 text-base-content/70 hover:text-base-content hover:bg-base-100/80 shadow-sm border border-base-content/10 cursor-pointer" title="Toggle dark/light mode">
            <input type="checkbox" id="theme-toggle" />
            <span class="material-symbols-outlined swap-off text-[22px]">dark_mode</span>
            <span class="material-symbols-outlined swap-on text-[22px]">light_mode</span>
        </label>
    </div>

    <!-- 429 Container -->
    <div class="relative z-10 text-center max-w-sm w-full">
        <!-- Minimal Card -->
        <div class="card bg-base-100/90 backdrop-blur-md shadow-2xl border border-base-content/10 rounded-3xl p-8 sm:p-10 space-y-4">
            <!-- 429 Status Number -->
            <div class="font-mono text-8xl font-black text-warning leading-none" style="font-size: 6rem; line-height: 1;">
                429
            </div>

            <!-- Too many request -->
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-base-content">
                Too many request
            </h1>

            <!-- Try Again after a minute -->
            <p class="text-sm text-base-content/60 font-medium">
                Try Again after a minute
            </p>

            <!-- Action Button -->
            <div class="pt-3">
                <button type="button" onclick="window.location.reload()"
                        class="btn btn-warning btn-sm w-full rounded-xl shadow-lg shadow-warning/20 font-semibold gap-2">
                    <span class="material-symbols-outlined text-[16px]">refresh</span>
                    Try Again
                </button>
            </div>
        </div>
    </div>

    <!-- FlyonUI JS -->
    <script src="{{ url_for('static', filename='js/flyonui.js') }}"></script>

    <script>
        // Theme Toggle with persistence
        (function() {
            const themeToggle = document.getElementById('theme-toggle');
            const html = document.documentElement;
            
            const savedTheme = localStorage.getItem('admin-theme') || html.getAttribute('data-theme') || 'vscode';
            html.setAttribute('data-theme', savedTheme);
            
            if (themeToggle) {
                themeToggle.checked = (savedTheme === 'valorant');
                themeToggle.addEventListener('change', () => {
                    const newTheme = themeToggle.checked ? 'valorant' : 'vscode';
                    html.setAttribute('data-theme', newTheme);
                    localStorage.setItem('admin-theme', newTheme);
                });
            }
        })();
    </script>
</body>
</html>
